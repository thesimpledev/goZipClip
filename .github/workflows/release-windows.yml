# Builds the Windows release of ZipClip on a native Windows runner and
# publishes it to the website bucket when a v* tag is pushed.
# Independent of the Linux and website deployments by design.
#
# Publish rules (do not change casually, the site links depend on them):
#   bucket: gozipclip.com-825a66c84550b1da (us-east-2, public read)
#   key:    downloads/zipclip-windows-amd64.zip (application/zip)
#   cache:  max-age=3600
# Only ever write under downloads/. Every other key belongs to the
# website deploy workflow and its delete pass. Never publish debug
# builds or config files: the bucket is world-readable.
#
# One-time AWS setup is documented in release-linux.yml; both release
# workflows share the same role and the AWS_RELEASE_ROLE_ARN secret.
#
# Each deployment has its own tag namespace: windows-v* releases
# Windows only. Linux uses linux-v*, and the website deploys
# separately.

name: Release Windows

on:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: read
  id-token: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: Test
        working-directory: desktop
        run: go test ./... -race -vet=all -shuffle=on -count=1
      - name: Build
        working-directory: desktop
        run: go build -trimpath -ldflags -H=windowsgui -o zipclip.exe .
      - name: Package
        run: Compress-Archive -Path desktop/zipclip.exe, desktop/LICENSE, desktop/README.md -DestinationPath zipclip-windows-amd64.zip
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-2
      - name: Upload to website bucket
        run: >
          aws s3api put-object
          --bucket gozipclip.com-825a66c84550b1da
          --key downloads/zipclip-windows-amd64.zip
          --body zipclip-windows-amd64.zip
          --content-type application/zip
          --cache-control "max-age=3600"
